[workspace]
resolver = "2"
members = ["crates/fl-core", "crates/fl-gpu", "crates/fl-view", "crates/fl-wasm", "crates/frankenlife"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
png = "0.18.1"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
debug = false
codegen-units = 1

[profile.test]
opt-level = 3

[profile.release.package.fl-wasm]
strip = true
